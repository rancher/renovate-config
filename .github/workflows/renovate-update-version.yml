name: Update Renovate Vault Pin
on:
  workflow_dispatch:
    inputs:
      targetRepository:
        description: "Target repository (e.g., 'rancher/test')"
        required: true
        type: string
      version:
        description: "Target version of rancher/renovate-config to pin (e.g., 'v1.0.11')"
        required: true
        type: string

permissions:
  id-token: write

jobs:
  update-renovate-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Set owner and repository values
        id: set_values
        env:
          TARGET_REPOSITORY: '${{ github.event.inputs.targetRepository }}'
        run: |
          owner=$(echo "${TARGET_REPOSITORY}" | cut -d '/' -f1)
          repositories=$(echo "${TARGET_REPOSITORY}" | cut -d '/' -f2)
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      - name: Load Secrets from Vault
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/org/${{ github.repository_owner }}/github/renovate-rancher appId | APP_ID ;
            secret/data/github/org/${{ github.repository_owner }}/github/renovate-rancher privateKey | PRIVATE_KEY

      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ steps.set_values.outputs.owner }}
          repositories: ${{ steps.set_values.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Resolve target version SHA and update file
        env:
          TARGET_REPOSITORY: '${{ github.event.inputs.targetRepository }}'
          NEW_VERSION: '${{ github.event.inputs.version }}'
          GH_TOKEN: '${{ steps.get_token.outputs.token }}'
        run: |
          FILE_PATH=".github/workflows/renovate-vault.yml"
          ACTION_REF="rancher/renovate-config/.github/workflows/renovate-vault.yml"

          echo "Targeting repository: ${TARGET_REPOSITORY}"
          echo "Target version: ${NEW_VERSION}"

          # 1. Fetch commit SHA for the target tag from rancher/renovate-config
          TAG_OBJ=$(gh api "repos/rancher/renovate-config/git/refs/tags/${NEW_VERSION}" 2>/dev/null || true)
          NEW_SHA=$(echo "${TAG_OBJ}" | jq -r '.object.sha // empty')
          TAG_TYPE=$(echo "${TAG_OBJ}" | jq -r '.object.type // empty')

          # Dereference annotated tag if necessary
          if [ "${TAG_TYPE}" = "tag" ]; then
            NEW_SHA=$(gh api "repos/rancher/renovate-config/git/tags/${NEW_SHA}" --jq '.object.sha // empty' 2>/dev/null || true)
          fi

          if [ -z "${NEW_SHA}" ]; then
            echo "Error: Tag '${NEW_VERSION}' not found or could not be resolved in rancher/renovate-config."
            exit 1
          fi

          echo "Resolved ${NEW_VERSION} ->${NEW_SHA}"

          # 2. Retrieve target repository default branch
          DEFAULT_BRANCH=$(gh api "repos/${TARGET_REPOSITORY}" --jq '.default_branch' 2>/dev/null || true)
          if [ -z "${DEFAULT_BRANCH}" ]; then
            echo "Error: Could not fetch default branch for ${TARGET_REPOSITORY}."
            exit 1
          fi

          # 3. Retrieve target file content
          FILE_INFO=$(gh api "repos/${TARGET_REPOSITORY}/contents/${FILE_PATH}?ref=${DEFAULT_BRANCH}" 2>/dev/null || true)
          if [ -z "${FILE_INFO}" ]; then
            echo "Skipping: ${FILE_PATH} does not exist in${TARGET_REPOSITORY}."
            echo "File \`${FILE_PATH}\` not found in \`${TARGET_REPOSITORY}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FILE_CONTENT=$(echo "${FILE_INFO}" | jq -r '.content // empty' | base64 -d 2>/dev/null || true)

          if ! echo "${FILE_CONTENT}" \vert{} grep -q "${ACTION_REF}"; then
            echo "Skipping: Action reference '${ACTION_REF}' not present in${FILE_PATH}."
            echo "Reference \`${ACTION_REF}\` not found in \`${TARGET_REPOSITORY}:${FILE_PATH}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 4. Perform substitution
          UPDATED_CONTENT=$(printf '%s' "${FILE_CONTENT}" \vert{} sed -E "s~(${ACTION_REF}@)[^[:space:]]+( #[^\n]*)?~\1${NEW_SHA} # ${NEW_VERSION}~g")

          if [ "${FILE_CONTENT}" = "${UPDATED_CONTENT}" ]; then
            echo "Skipping: File is already pinned to ${NEW_VERSION} (${NEW_SHA})."
            echo "No changes required for \`${TARGET_REPOSITORY}\`: already set to \`${NEW_VERSION}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="update-renovate-vault-${NEW_VERSION}"

          # 5. Check if an open PR already exists
          EXISTING_PR=$(gh pr list -R "${TARGET_REPOSITORY}" --head "${BRANCH}" --state open --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -n "${EXISTING_PR}" ]; then
            echo "Skipping: PR already open at ${EXISTING_PR}"
            echo "PR already open for \`${TARGET_REPOSITORY}\`: ${EXISTING_PR}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 6. Create Git Tree and Commit via Git Data API
          PARENT_SHA=$(gh api "repos/${TARGET_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')
          BASE_TREE_SHA=$(gh api "repos/${TARGET_REPOSITORY}/git/commits/${PARENT_SHA}" --jq '.tree.sha')

          NEW_BLOB_B64=$(printf '\%s' "${UPDATED_CONTENT}" | base64 -w0)
          NEW_BLOB_SHA=$(gh api "repos/${TARGET_REPOSITORY}/git/blobs" -X POST -f content="${NEW_BLOB_B64}" -f encoding="base64" --jq '.sha')

          TREE_ITEMS=$(jq -n --arg sha "${NEW_BLOB_SHA}" --arg path "${FILE_PATH}" '[{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')

          NEW_TREE_SHA=$(gh api "repos/${TARGET_REPOSITORY}/git/trees" -X POST \
            --input <(jq -n --arg base_tree "${BASE_TREE_SHA}" --argjson tree "${TREE_ITEMS}" '{base_tree: $base_tree, tree:$tree}') \
            --jq '.sha')

          NEW_COMMIT_SHA=$(gh api "repos/${TARGET_REPOSITORY}/git/commits" -X POST \
            --input <(jq -n --arg msg "Update renovate-vault workflow to ${NEW_VERSION}" --arg tree "${NEW_TREE_SHA}" --arg parent "${PARENT_SHA}" '{message: $msg, tree: $tree, parents: [$parent]}') \
            --jq '.sha')

          # 7. Create or update branch reference idempotently
          REF_PATH="repos/${TARGET_REPOSITORY}/git/refs/heads/${BRANCH}"
          if gh api "${REF_PATH}" >/dev/null 2>&1; then
            gh api "${REF_PATH}" -X PATCH -f sha="${NEW_COMMIT_SHA}" -f force=true >/dev/null
          else
            gh api "repos/${TARGET_REPOSITORY}/git/refs" -X POST \
              -f ref="refs/heads/${BRANCH}" \
              -f sha="${NEW_COMMIT_SHA}" >/dev/null
          fi

          # 8. Create Pull Request
          CREATED_PR=$(gh pr create -R "${TARGET_REPOSITORY}" \
            --title "Update renovate-vault workflow to ${NEW_VERSION}" \
            --body "This PR updates \`${FILE_PATH}\` action reference to \`${NEW_VERSION}\` (\`${NEW_SHA}\`).\n\nAutomated update triggered by @${GITHUB_ACTOR}." \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}")

          {
            echo "## Renovate Vault Pin Update Result"
            echo "Successfully created PR for [${TARGET_REPOSITORY}](${CREATED_PR}):${CREATED_PR}"
            echo "- Target Version: \`${NEW_VERSION}\`"
            echo "- Resolved SHA: \`${NEW_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
