name: Tag release

# Consumers pin `.github/workflows/renovate-vault.yml@<sha> # <tag>`, so every
# change of that reusable workflow on main needs a tag. The scheduled run is a
# backstop for a tag push that a failed run left behind; the diff guard keeps it
# from tagging a main tip that holds no workflow change.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/renovate-vault.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create patch tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [[ ! "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "No SemVer tag found"
            exit 1
          fi
          if git diff --quiet "${latest_tag}..HEAD" -- \
            .github/workflows/renovate-vault.yml; then
            echo "No Renovate workflow changes since ${latest_tag}"
            exit 0
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}

          # A run that lost the race to push the next tag must not be dropped,
          # because the change it tags would then stay untagged until the
          # scheduled backstop.
          while git rev-parse --verify --quiet "refs/tags/v${major}.${minor}.${patch}" >/dev/null; do
            patch=$((patch + 1))
          done
          next_tag="v${major}.${minor}.${patch}"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${next_tag}" -m "Release ${next_tag}" HEAD
          gh auth setup-git
          git push origin "${next_tag}"
