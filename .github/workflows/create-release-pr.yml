---
name: Create release PR

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 10 * * 3'

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Rewrite main references for release
        run: |
          set -euo pipefail
          while IFS= read -r -d '' config; do
            sed -i 's/#main/#release/g' "${config}"
          done < <(git ls-files -z -- '*.json')

          git ls-files -z -- '*.json' | git add --pathspec-from-file=- --pathspec-file-nul

      - name: Get current week
        run: echo "RELEASE_WEEK=$(date -u +%V)" >> "${GITHUB_ENV}"

      - name: Create release PR
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: release
          branch: release-candidate-${{ github.run_id }}
          commit-message: Promote main configuration to release
          title: Release week ${{ env.RELEASE_WEEK }}
          body: Automatically created PR to merge main into release
